<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Aceleraciones</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Monitor de Aceleraciones en Tiempo Real</h1>
        
        <!-- Sección de valores en tiempo real -->
        <div class="realtime-section">
            <div class="value-card" id="accelerationCard">
                <h2>Aceleración Actual</h2>
                <div class="value-display" id="accelerationValue">0.00</div>
                <div class="status" id="accelerationStatus">Normal</div>
                        <!-- Componentes individuales -->
                <div class="components-container">
                    <div class="component">
                        <span class="component-label">X:</span>
                        <span class="component-value" id="xValue">0.00</span>
                    </div>
                    <div class="component">
                        <span class="component-label">Y:</span>
                        <span class="component-value" id="yValue">0.00</span>
                    </div>
                    <div class="component">
                        <span class="component-label">Z:</span>
                        <span class="component-value" id="zValue">0.00</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Gráfico de aceleraciones -->
        <div class="chart-container">
            <canvas id="accelerationChart"></canvas>
        </div>
        
        <!-- Sección de Insights -->
        <div class="insights-section">
            <button id="insightsBtn">Solicitar Insights</button>
            <div class="insights-result" id="insightsResult">
                Los insights aparecerán aquí...
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
